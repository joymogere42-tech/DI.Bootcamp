<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Wars AJAX App</title>

  <!-- FontAwesome for loading icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: yellow;
    }

    #card {
      border: 2px solid yellow;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      background: yellow;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .loading {
      font-size: 30px;
      margin-top: 20px;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>⭐ Star Wars Character</h1>

  <button id="btn">Get Random Character</button>

  <div id="card">
    <p>Click the button to load a character</p>
  </div>

  <script>
    const button = document.getElementById("btn");
    const card = document.getElementById("card");

    // Get random number (1–83)
    function getRandomId() {
      return Math.floor(Math.random() * 83) + 1;
    }

    // Fetch character
    async function getCharacter() {
      const id = getRandomId();

      // Show loading
      card.innerHTML = `
        <div class="loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p>Loading...</p>
        </div>
      `;

      try {
        // Fetch character
        const response = await fetch(`https://www.swapi.tech/api/people/${id}`);
        const data = await response.json();
        const person = data.result.properties;

        // Fetch homeworld
        const homeworldResponse = await fetch(person.homeworld);
        const homeworldData = await homeworldResponse.json();

        // Display data
        card.innerHTML = `
          <h2>${person.name}</h2>
          <p><strong>Height:</strong> ${person.height}</p>
          <p><strong>Gender:</strong> ${person.gender}</p>
          <p><strong>Birth Year:</strong> ${person.birth_year}</p>
          <p><strong>Homeworld:</strong> ${homeworldData.result.properties.name}</p>
        `;
      } catch (error) {
        card.innerHTML = `
          <p class="error"> Error fetching data</p>
        `;
      }
    }

    // Event listener
    button.addEventListener("click", getCharacter);
  </script>

</body>
</html>

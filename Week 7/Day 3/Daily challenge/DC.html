<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register</title>
<script>
function validateForm() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    document.getElementById('registerBtn').disabled = !(firstName && lastName && email && username && password);
}

async function register() {
    const data = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
    };
    const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const result = await response.json();
    alert(result.message);
}
</script>
</head>
<body>
<h2>Register</h2>
<form oninput="validateForm()">
<label>First Name:</label><input type="text" id="firstName" /><br/>
<label>Last Name:</label><input type="text" id="lastName" /><br/>
<label>Email:</label><input type="email" id="email" /><br/>
<label>Username:</label><input type="text" id="username" /><br/>
<label>Password:</label><input type="password" id="password" /><br/>
<button type="button" id="registerBtn" disabled onclick="register()">Register</button>
</form>
</body>
</html>

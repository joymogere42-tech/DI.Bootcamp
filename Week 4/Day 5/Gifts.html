<!DOCTYPE html>
<html>
<head>
  <title>Giphy Random Search</title>
</head>
<body>

  <h2>Search a GIF</h2>

  <!-- Form -->
  <form id="gifForm">
    <input type="text" id="searchInput" placeholder="Enter category (e.g. sun)" required>
    <button type="submit">Get GIF</button>
  </form>

  <!-- Delete All Button -->
  <button id="deleteAll">DELETE ALL</button>

  <!-- Container for GIFs -->
  <div id="gifContainer"></div>

  <script>
    const form = document.getElementById("gifForm");
    const input = document.getElementById("searchInput");
    const container = document.getElementById("gifContainer");
    const deleteAllBtn = document.getElementById("deleteAll");

    const API_KEY = "hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My";

    // Handle form submit
    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const searchTerm = input.value;

      try {
        const url = `https://api.giphy.com/v1/gifs/random?tag=${searchTerm}&api_key=${API_KEY}`;

        const response = await fetch(url);

        // Check response
        if (!response.ok) {
          throw new Error("Failed to fetch GIF");
        }

        const data = await response.json();

        // Get GIF URL
        const gifUrl = data.data.images.original.url;

        // Create elements
        const gifDiv = document.createElement("div");

        const img = document.createElement("img");
        img.src = gifUrl;
        img.style.width = "200px";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "DELETE";

        // Delete single GIF
        deleteBtn.addEventListener("click", function() {
          gifDiv.remove();
        });

        // Append elements
        gifDiv.appendChild(img);
        gifDiv.appendChild(deleteBtn);
        container.appendChild(gifDiv);

      } catch (error) {
        console.error("Error:", error);
      }

      input.value = "";
    });

    // Delete all GIFs
    deleteAllBtn.addEventListener("click", function() {
      container.innerHTML = "";
    });

  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Solar System</title>
    <style>
        body {
            background-color: black;
            padding: 10px;
        }
        .planet {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            text-align: center;
            padding: 10px;
            position: relative;
            border: 2px solid white;
            margin: 10px;
            display: inline-block;
            color: white;
            font-size: 12px;
        }
        .moon {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgb(237, 237, 237);
            border: 2px solid red;
        }
    </style>
</head>
<body>

<section class="listPlanets"></section>

<script>
    const section = document.querySelector(".listPlanets");

    const planets = [
        { name: "Mercury", color: "gray", moons: 0 },
        { name: "Venus", color: "orange", moons: 0 },
        { name: "Earth", color: "blue", moons: 1 },
        { name: "Mars", color: "red", moons: 2 },
        { name: "Jupiter", color: "brown", moons: 4 },
        { name: "Saturn", color: "gold", moons: 3 },
        { name: "Uranus", color: "lightblue", moons: 2 },
        { name: "Neptune", color: "darkblue", moons: 1 }
    ];

    planets.forEach(planet => {
        const planetDiv = document.createElement("div");
        planetDiv.classList.add("planet");
        planetDiv.style.backgroundColor = planet.color;
        planetDiv.textContent = planet.name;

        // Create moons
        for (let i = 0; i < planet.moons; i++) {
            const moonDiv = document.createElement("div");
            moonDiv.classList.add("moon");

            // Random position
            moonDiv.style.top = Math.random() * 70 + "px";
            moonDiv.style.left = Math.random() * 70 + "px";

            planetDiv.appendChild(moonDiv);
        }

        section.appendChild(planetDiv);
    });
</script>

</body>
</html>
